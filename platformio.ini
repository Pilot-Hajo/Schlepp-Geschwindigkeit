[common]
platform = espressif32
board = ttgo-lora32-v1
framework = arduino
lib_deps =
    sandeepmistry/LoRa @ ^0.8.0
    adafruit/Adafruit SSD1306 @ ^2.5.7
    adafruit/Adafruit GFX Library @ ^1.11.9

[env:sender]
extends = common
build_src_filter = +<sender/>

[env:receiver]
extends = common
build_src_filter = +<receiver/>
