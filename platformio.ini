[common]
platform = espressif32
board = ttgo-lora32-v1
framework = arduino
lib_deps =
    sandeepmistry/LoRa @ ^0.8.0
    olikraus/U8g2 @ ^2.35.30

[env:sender]
extends = common
build_src_filter = +<sender/>

[env:receiver]
extends = common
build_src_filter = +<receiver/>
; Kernmeldungen aus: ohne Karte schreibt die SD-Bibliothek sonst bei jedem
; Einhaengeversuch zwei Fehlerzeilen, die die eigene Meldung nur wiederholen
build_flags = -DCORE_DEBUG_LEVEL=0
